services:
  mysql:
    image: mysql:8.4
    container_name: nextlvlstock-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin:5.2.2
    container_name: nextlvlstock-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
     - "8080:80"
    depends_on:
      - mysql
  php:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: nextlvlstock-php
    restart: unless-stopped
    depends_on:
      - mysql
    volumes:
      - ./backend:/var/www
  nginx:
    image: nginx:1.28
    container_name: nextlvlstock-nginx
    ports: 
     - "80:80"
    volumes:
      - ./backend:/var/www
      # "Toma el archivo default.conf de mi computador y reemplaza el archivo de configuración por defecto de Nginx dentro del contenedor."
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
volumes:
  mysql_data: